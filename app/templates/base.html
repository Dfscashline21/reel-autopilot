<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Reel Autopilot{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if not bare %}
<header>
  <div class="brand">Reel Autopilot</div>
  <nav>

</body>
</html>
